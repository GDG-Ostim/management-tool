name: Vault
on:
  pull_request:
    paths:
      - "vault/**"
      - "scripts/**"
      - "AGENTS.md"
      - "package.json"
      - ".github/workflows/vault.yml"
  push:
    branches:
      - main
    paths:
      - "vault/**"
      - "scripts/**"
      - "AGENTS.md"
      - "package.json"
      - ".github/workflows/vault.yml"
permissions:
  contents: read
jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run vault:check
      - run: npm run test:tooling
